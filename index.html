    <!-- Sandbox storage shim — MUST stay before any other script.
         In a sandboxed iframe without allow-same-origin (link-preview crawlers,
         embedded viewers, some in-app browsers), merely *reading*
         window.localStorage / sessionStorage / document.cookie throws a
         SecurityError. That throw happens during React render and blanks the
         whole app. This replaces the inaccessible natives with in-memory
         stand-ins so every downstream call site — ours and third-party — is
         safe without needing its own try/catch. -->
    <script>
      (function () {
        function memoryStorage() {
          var m = {};
          return {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(m, String(k)) ? m[String(k)] : null; },
            setItem: function (k, v) { m[String(k)] = String(v); },
            removeItem: function (k) { delete m[String(k)]; },
            clear: function () { m = {}; },
            key: function (i) { var ks = Object.keys(m); return i < ks.length ? ks[i] : null; },
            get length() { return Object.keys(m).length; }
          };
        }
        ["localStorage", "sessionStorage"].forEach(function (name) {
          var usable = false;
          try {
            var s = window[name];
            s.setItem("__probe__", "1");
            s.removeItem("__probe__");
            usable = true;
          } catch (e) { usable = false; }
          if (!usable) {
            try {
              Object.defineProperty(window, name, {
                value: memoryStorage(), configurable: true, writable: true
              });
            } catch (e) { /* nothing more we can do */ }
          }
        });
        try {
          void document.cookie;
        } catch (e) {
          var jar = "";
          try {
            Object.defineProperty(document, "cookie", {
              get: function () { return jar; },
              set: function (v) { jar = jar ? jar + "; " + String(v).split(";")[0] : String(v).split(";")[0]; },
              configurable: true
            });
          } catch (e2) { /* nothing more we can do */ }
        }
        // crypto.randomUUID only exists in a secure context. A sandboxed iframe
        // with origin "null" is not secure, so calling it throws and kills the
        // app. Provide an RFC-4122 v4 fallback built on getRandomValues, or
        // Math.random as a last resort.
        try {
          if (!window.crypto || typeof window.crypto.randomUUID !== "function") {
            var c = window.crypto || {};
            var rand = function (n) {
              var a = new Uint8Array(n);
              if (typeof c.getRandomValues === "function") {
                c.getRandomValues(a);
              } else {
                for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);
              }
              return a;
            };
            var uuid = function () {
              var b = rand(16);
              b[6] = (b[6] & 0x0f) | 0x40;
              b[8] = (b[8] & 0x3f) | 0x80;
              var h = [];
              for (var i = 0; i < 16; i++) h.push((b[i] + 0x100).toString(16).slice(1));
              return h.slice(0, 4).join("") + "-" + h.slice(4, 6).join("") + "-" +
                     h.slice(6, 8).join("") + "-" + h.slice(8, 10).join("") + "-" +
                     h.slice(10, 16).join("");
            };
            if (window.crypto) {
              try { window.crypto.randomUUID = uuid; }
              catch (e3) {
                Object.defineProperty(window, "crypto", {
                  value: Object.assign({}, c, { randomUUID: uuid }),
                  configurable: true, writable: true
                });
              }
            }
          }
        } catch (e) { /* nothing more we can do */ }
      })();
    </script>

    <!-- GFP UTM Attribution Tracking -->
    <script>
      window.GFP = window.GFP || {};
      GFP.track = function(eventName, data) {
        if (typeof fbq !== 'undefined') fbq('trackCustom', eventName, data || {});
        if (typeof gtag !== 'undefined') gtag('event', eventName, data || {});
      };
      (function() {
        var params = new URLSearchParams(window.location.search);
        var utmKeys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
        var stored = {};
        // Storage access throws a SecurityError in sandboxed iframes (link
        // preview crawlers, embedded viewers). Never let tracking break the page.
        var ssSet = function(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} };
        var ssGet = function(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
        utmKeys.forEach(function(k) {
          var v = params.get(k);
          if (v) { stored[k] = v; ssSet(k, v); }
          else { var s = ssGet(k); if (s) stored[k] = s; }
        });
        if (Object.keys(stored).length > 0) {
          GFP.track('utm_visit', stored);
        }
        var email = params.get('e');
        if (email) { ssSet('gfp_visitor_email', email); }
      })();
